[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sdk-atlas"
version = "0.1.0"
description = "Static, source-derived inventory of Python modules and SDK surfaces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "coverage[toml]>=7.8,<8",
    "hatchling>=1.27,<2",
    "hypothesis>=6.130,<7",
    "mypy>=1.15,<3",
    "pip>=25,<27",
    "pip-audit>=2.9,<3",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
]
mutation = ["cosmic-ray>=8.7,<9"]

[project.scripts]
sdk-atlas = "sdk_atlas.cli:main"

[tool.hatch.build]
reproducible = true
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/*.egg-info/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/sdk_atlas"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/scripts",
    "/.github",
    "/.gitignore",
    "/.gitattributes",
    "/*.md",
    "/pyproject.toml",
]

[tool.ruff]
# The repository adopts the 88-column Ruff formatter profile as its documented
# extension of PEP 8's default line width; standards.md section 5 permits this.
line-length = 88
target-version = "py311"
src = ["src"]
extend-exclude = ["build", "dist", ".venv"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "scripts", "examples"]
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
norecursedirs = ["build", "dist", ".venv", ".git", ".cache", ".hypothesis"]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
    "--cov=sdk_atlas",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=json:.cache/coverage.json",
    "--cov-report=xml:.cache/coverage.xml",
    "-ra",
]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["sdk_atlas"]
relative_files = true

[tool.coverage.report]
# This combined statement/branch floor complements the separate line and branch
# thresholds checked by scripts/check_coverage.py. No production files are omitted.
fail_under = 94
precision = 2
show_missing = true

[tool.sdk_atlas.coverage-gate]
minimum_lines = 95
minimum_branches = 90
minimum_file_lines = 90
minimum_file_branches = 80
