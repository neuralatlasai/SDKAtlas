name: Latest package compatibility

on:
  push:
    branches: [main]
  schedule:
    # UTC; external package drift is checked independently of offline quality.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest:
    name: Live --latest (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [openai, agents, numpy]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e .
      - run: .venv/bin/python scripts/package_regressions.py --mode latest --package ${{ matrix.package }} --report .cache/latest-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: latest-${{ matrix.package }}
          path: .cache/latest-report.json
          if-no-files-found: error
